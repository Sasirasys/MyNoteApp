## MyNote
---
# Service (type: LoadBalancer) to open up the app to the world (localhost)
apiVersion: v1
kind: Service
metadata:
  name: mynote-app-loadbalancer
  labels:
    app: mynote-app
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 3000
      protocol: TCP
  selector:
    app: mynote-app
---
#  Deployment to launch one container of sasirasys/mynote-app in a pod
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mynote-app
  labels:
    app: mynote-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mynote-app
  template:
    metadata:
      labels:
        app: mynote-app
    spec:
      containers:
        - name: mynote-app
          image: sasirasys/mynote-app
          ports:
            - containerPort: 3000


## UserService
---
#
apiVersion: v1
kind: Service
metadata:
  name: mynote-user-service
  labels:
    app: mynote-user
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 3001
      protocol: TCP
  selector:
    app: mynote-user
---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mynote-user
  labels:
    app: mynote-user
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mynote-user
  template:
    metadata:
      labels:
        app: mynote-user
    spec:
      containers:
        - name: mynote-user
          image: sasirasys/mynote-user-service
          ports:
            - containerPort: 3001
          env:
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: mynote-app-config
                  key: database_host


