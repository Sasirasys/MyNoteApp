## Database
---
# headless service for access
apiVersion: v1
kind: Service
metadata:
  name: mynote-database-service
  labels:
    app: mynote-database
spec:
  ports:
    - port: 27017
  selector:
    app: mynote-database
---
# 1 container per pod
# 2 persistentVolumClaims: mynote-data, mongo-config
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mynote-database
  labels:
    app: mynote-database
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mynote-database
  template:
    metadata:
      labels:
        app: mynote-database
    spec:
      containers:
        - name: mynote-database
          image: mongo
          ports:
            - containerPort: 27017
              name: mongodb-port
          volumeMounts:
            - name: mynote-data
              mountPath: /data/db
            - name: mongo-config
              mountPath: /data/configdb
  volumeClaimTemplates:
    - metadata:
        name: mynote-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Mi
    - metadata:
        name: mongo-config
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Mi


## ConfigMap to store environment vairables
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mynote-app-config
  labels:
    data: config
data:
  database_host: "NOTSET"
---
